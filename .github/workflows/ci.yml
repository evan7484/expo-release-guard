name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: build · package · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # exports·types·files 설정이 실제 소비자 환경에서 맞는지 (publint, are-the-types-wrong)
      - run: npm run check:package
      # 소스가 아니라 배포될 tarball을 설치해 bin이 실제로 도는지 확인
      - name: Smoke test packed CLI
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE"/expo-release-guard-*.tgz
          npx expo-release-guard check --cwd "$GITHUB_WORKSPACE/test/fixtures/expo-app"
          npx expo-release-guard list

  action:
    name: GitHub Action (composite) smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 배포된 버전으로 composite action 자체(입력 전달·인자 조립)를 검증한다.
      # 0.1.0에 있는 검사만 지정해, 새 버전 배포 전에도 이 잡이 돈다.
      - uses: ./
        with:
          working-directory: test/fixtures/expo-app
          checks: ios-plist android-manifest
          version: 0.1.0
