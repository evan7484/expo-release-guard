name: expo-release-guard
description: Check Expo prebuild output (Info.plist, AndroidManifest, app icons) before you ship a build that cannot launch.
author: Choi Junseo
branding:
  icon: shield
  color: green

inputs:
  checks:
    description: Space-separated check ids to run. Empty runs the default checks (see `expo-release-guard list`).
    required: false
    default: ""
  config:
    description: Path to the config file, relative to working-directory. Empty searches release-guard.config.{json,js,mjs}.
    required: false
    default: ""
  working-directory:
    description: Expo project root (useful in monorepos).
    required: false
    default: "."
  prebuild:
    description: >-
      Run `expo prebuild --no-install` first: `none`, `ios`, `android`, or `all`.
      Dependencies must already be installed (e.g. `npm ci`).
    required: false
    default: "none"
  version:
    description: expo-release-guard version from npm. Pin it for reproducible CI.
    required: false
    default: "0.2.0"

runs:
  using: composite
  steps:
    - name: Expo prebuild
      if: inputs.prebuild != 'none'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLATFORM: ${{ inputs.prebuild }}
      run: npx expo prebuild --clean --no-install --platform "$PLATFORM"
    - name: expo-release-guard check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ERG_VERSION: ${{ inputs.version }}
        ERG_CHECKS: ${{ inputs.checks }}
        ERG_CONFIG: ${{ inputs.config }}
      # 입력을 셸에 직접 끼우지 않고 env로 넘긴다 — 워크플로 입력을 통한 명령 주입을 막기 위해.
      run: |
        args=(check)
        if [ -n "$ERG_CHECKS" ]; then read -r -a ids <<< "$ERG_CHECKS"; args+=("${ids[@]}"); fi
        if [ -n "$ERG_CONFIG" ]; then args+=(--config "$ERG_CONFIG"); fi
        npx --yes "expo-release-guard@${ERG_VERSION}" "${args[@]}"
